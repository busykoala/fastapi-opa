[project]
name = "fastapi-opa"
version = "2.0.4"
description = "FastAPI OPA middleware incl. auth flow."
authors = [{name = "Matthias Osswald", email = "info@busykoala.io"}]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "fastapi>=0.109.2",
    "itsdangerous",
    "requests",
    "PyJWT[crypto]>=2.4",
    "urllib3>=2.6.3",
    "starlette>=0.47.2",
]
keywords = [
    "fastapi",
    "oidc",
    "authentication",
    "authorization",
    "saml",
    "pkce",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project.optional-dependencies]
graphql = ["graphene>=2,<3"]
saml = ["python3-saml", "python-multipart"]
authlib = ["authlib>=1.6.4,<2.0.0"]

[project.urls]
Repository = "https://github.com/busykoala/fastapi-opa"

[dependency-groups]
dev = [
    "bandit",
    "freezegun",
    "httpx",
    "mock",
    "nest-asyncio",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-timeout>=2.3.1",
    "ruff",
    "setuptools>=78.1.1",
    "pysentry-rs",
    "vale>=2.20.2",
]

[tool.hatch.build]
exclude = ["fastapi_opa/example_oidc.py", "fastapi_opa/example_oidc_pkce.py", "fastapi_opa/example_saml.py"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore:.*insecure.*:UserWarning",
    "ignore:.*key.*length.*:UserWarning",
    "ignore::jwt.warnings.InsecureKeyLengthWarning",
]
